# -- Service commands ----------------------------------------------------------

[service]
not_installed = "[dim]服务未安装。请运行 [bold]ductor service install[/bold]。[/dim]"
not_running = "[dim]服务未运行。[/dim]"
no_service = "[dim]未安装服务。[/dim]"
no_binary = "[bold red]在 PATH 中找不到 ductor 可执行文件。[/bold red]"
removed = "[green]服务已移除。[/green]"
started = "[green]服务已启动。[/green]"
stopped = "[green]服务已停止。[/green]"
start_failed = "[red]启动失败：{error}[/red]"
stop_failed = "[red]停止失败：{error}[/red]"

[service.install]
title = "ductor 后台服务"
body = """\
[bold green]ductor 现在作为后台服务运行。[/bold green]\n
{detail}\n
[bold]常用命令：[/bold]\n
  [cyan]ductor service status[/cyan]     查看是否在运行
  [cyan]ductor service stop[/cyan]       停止服务
  [cyan]ductor service logs[/cyan]       {logs_hint}
  [cyan]ductor service uninstall[/cyan]  移除服务"""

[service.linux]
no_systemd = "[bold red]未找到 systemd。安装服务需要带 systemd 的 Linux。[/bold red]"
linger_warning = "[bold yellow]必须启用 linger，这样注销后 ductor 仍会继续运行。[/bold yellow]"
linger_enabled = "[green]Linger 已启用。[/green]"
linger_manual = "[yellow]无法自动启用 linger。[/yellow]\n请手动运行：[bold]sudo loginctl enable-linger {user}[/bold]"
start_failed = "[bold red]启动服务失败：[/bold red] {error}"
detail = "开机启动，崩溃后自动重启。"

[service.macos]
no_launchctl = "[bold red]未找到 launchctl。安装服务需要 macOS。[/bold red]"
start_failed = "[bold red]加载 Launch Agent 失败：[/bold red] {error}"
detail = "登录时启动，崩溃后自动重启（10 秒节流）。"
unload_failed = "[red]卸载 Launch Agent 失败：{error}[/red]"
not_loaded = "[red]Launch Agent 未加载。请尝试：[bold]ductor service install[/bold][/red]"

[service.windows]
admin_title = "[bold yellow]需要管理员权限[/bold yellow]"
admin_body = """\
[bold yellow]需要管理员权限。[/bold yellow]\n
请以管理员身份打开终端后再试：\n
  [bold]1.[/bold] 右键 CMD 或 PowerShell
  [bold]2.[/bold] 选择 [cyan]'以管理员身份运行'[/cyan]
  [bold]3.[/bold] 运行：[cyan]ductor service install[/cyan]"""
no_scheduler = "[bold red]任务计划程序不可用。安装服务需要 Windows。[/bold red]"
no_pythonw = "[dim]注意：未找到 pythonw.exe。可能会看到控制台窗口。[/dim]"
create_failed = "[bold red]创建计划任务失败：[/bold red] {error}"
start_failed = "[bold red]任务已创建但启动失败：[/bold red] {error}"
remove_failed = "[red]移除任务失败：{error}[/red]"
detail = "登录后 10 秒启动，崩溃后自动重启（最多 3 次，间隔 1 分钟）。"
query_failed = "[red]无法查询任务状态：{error}[/red]"

[service.logs]
no_logs = "[dim]未找到日志文件。[/dim]"
showing = "[dim]显示 {name} 的最后 {count} 行[/dim]"
read_error = "[red]无法读取日志文件：{error}[/red]"
full_path = "[dim]完整日志：{path}[/dim]"
not_installed = "[dim]服务未安装。[/dim]"
streaming = "[dim]正在显示日志（Ctrl+C 停止）...[/dim]"
