status_disabled = "[dim]未启用[/dim]"

[api.missing_dep]
title = "[bold]缺少依赖[/bold]"
body = """\
[bold yellow]API 服务器（端到端加密）需要 PyNaCl。[/bold yellow]\n
安装方式：\n
  [bold]{hint}[/bold]\n
然后再次运行 [bold]ductor api enable[/bold]。"""

[api.enabled]
title = "[bold]API 服务器[/bold] [dim]（测试版）[/dim]"
body = """\
[bold green]API 服务器已启用。[/bold green]\n
  主机：   [cyan]{host}[/cyan]
  端口：   [cyan]{port}[/cyan]
  Token：  [cyan]{token}[/cyan]\n
[dim]重启机器人后才会启动 API 服务器。[/dim]
[dim]设计用于 Tailscale 或其他私有网络。[/dim]"""

[api.disabled]
status = "API 服务器：[dim]未启用[/dim]"

