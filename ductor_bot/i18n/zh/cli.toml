col_status = "状态"
selected = "[green]已选择[/green]"
not_selected = "[dim]—[/dim]"
apply_hint = "[dim]运行 'ductor docker rebuild'，将所选附加组件应用到镜像。[/dim]"
add_hint = "[dim]使用 'ductor docker extras-add <id>' 添加附加组件。[/dim]"
remove_hint = "[dim]使用 'ductor docker extras-remove <id>' 移除附加组件。[/dim]"
