# 中文聊天文案（Markdown，发送到 Telegram/Matrix/API）。

# -- Session management -------------------------------------------------------

[session]
error_header = "**会话错误**"
error_body = """\
[{model}] 发生错误。
会话已保留 —— 再发一条消息即可重试。
若问题持续，使用 /new 开始新会话。"""
error_cause = "**原因：** {hint}"
error_detail = "**详情：** `{detail}`"
error_auth = "认证失败。请重新登录 CLI（例如 `codex auth`），或检查 API Key。"
error_rate = "已达速率限制。请稍后再试。"
error_context = "上下文长度已超限。使用 /new 开始新会话。"

reset_header = "**会话已重置**"
reset_body = """\
仅重置了本聊天中 {provider} 的会话。
其他提供商的会话已保留。
发送消息即可继续。"""

age_warning = "[会话已持续 {age}。可用 /new 重新开始。]"

# #84: Tool-only turns (e.g. silent memory updates) surface this neutral
# status line instead of a blank message the user would never see.
empty_turn = "_(智能体已在后台静默更新记忆 — 再发一条消息即可继续。)_"

recovered = "_无法恢复上一会话，已自动开始新会话。_"
recovery_failed = "会话恢复失败。请再试一次，或使用 /new 开始新会话。"
sigkill = "执行被中断。请重新发送同一请求。"

not_found = "找不到会话 '{name}'。"
ended = "会话 '{name}' 已结束。使用 /session 开始新会话。"
still_running = "会话 '{name}' 仍在处理。请等待，或使用 /stop 取消。"

# -- Stop/interrupt ------------------------------------------------------------

[stop]
header = "**智能体已停止**"
killed = "{provider} 已停止，队列中的消息已全部丢弃。"
nothing = "当前没有正在运行的任务。"

[interrupt]
done = "已打断 {count} 个进程。"
nothing = "没有活动进程。"

[abort_all]
