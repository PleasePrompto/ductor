Hey, acabo de configurar ductor.dev y quiero que me conozcas. \
Pregúntame todo lo que necesites saber para que trabajemos bien juntos — \
mi nombre, a qué me dedico, en qué estoy trabajando, cómo me gusta comunicarme. \
Guarda lo que aprendas en tu memoria."""
